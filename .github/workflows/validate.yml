name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check bilingual home translations
        run: node --test tests/home-language.test.js

      - name: Check consistent Schulferienklar brand icon
        run: node --test tests/brand-icon-consistency.test.js

      - name: Validate Klaree time-of-day character states
        run: node --test tests/klaree-time.test.js

      - name: Validate state-aware Klaree holiday greetings
        run: node --test tests/klaree-seasonal.test.js

      - name: Validate Klaree Easter preview and noindex safeguards
        run: node --test tests/klaree-easter-preview.test.js

      - name: Validate homepage Klaree Easter encounters
        run: node --test tests/klaree-home-hunt.test.js

      - name: Check AdSense and CMP integration
        run: node --test tests/adsense-setup.test.js

      - name: Validate Bavaria Buß- und Bettag school-free days
        run: node --test tests/bayern-buss-und-bettag.test.js

      - name: Audit school-free days across all 16 states
        run: node --test tests/statewide-school-free-rules.test.js

      - name: Validate data and build SEO
        run: npm run build:seo:checked

      - name: Validate English home output
        run: node scripts/validate-home-languages.mjs
